name: CI

on:
  push:
    branches: [master, windows-support]
  pull_request:

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        # GUI 链接 webkit2gtk-4.0：22.04 仓库提供该 -dev 包（24.04 起仅 4.1）
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./internal/... -v
      - name: Install GUI toolchain (Linux)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update -qq &&
          sudo apt-get install -y -qq libgtk-3-dev
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
      - name: Set up MinGW (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
          release: false
      - name: Add MinGW to PATH (Windows)
        if: runner.os == 'Windows'
        run: echo "C:\msys64\ucrt64\bin" >> $GITHUB_PATH
      - name: Build GUI (CGO, -tags gui)
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: "1"
        run: go build -tags gui -o dist/devswitch-gui-check ./cmd/devswitch
      - name: Build GUI (CGO, -tags gui)
        if: runner.os == 'Windows'
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: go build -tags gui -o dist/devswitch-gui-check.exe ./cmd/devswitch
      - name: Set up llvm-mingw (arm64 交叉 CGO)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -fsSL -o /tmp/llvm-mingw.zip \
            https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-x86_64.zip
          7z x /tmp/llvm-mingw.zip -o/c/ > /dev/null
          mv /c/llvm-mingw-* /c/llvm-mingw
      - name: Build GUI (arm64 交叉)
        if: runner.os == 'Windows'
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOARCH: arm64
          CC: C:/llvm-mingw/bin/aarch64-w64-mingw32-clang
          CXX: C:/llvm-mingw/bin/aarch64-w64-mingw32-clang++
        run: go build -tags gui -o dist/devswitch-gui-arm64-check.exe ./cmd/devswitch

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run tests
        run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build UI bundle
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
